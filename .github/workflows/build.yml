name: Build and test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Make gradlew executable
        run: chmod +x gradlew
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: temurin
      - name: Install Android SDK packages
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-33" "build-tools;33.0.0" "platform-tools"
      - name: Run unit tests
        run: ./gradlew :app:testDebugUnitTest --stacktrace
      - name: Build debug APK
        run: ./gradlew :app:assembleDebug --stacktrace
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: meta-sms-gateway-debug
          path: app/build/outputs/apk/debug/app-debug.apk
      - name: Publish APK to GitHub Release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk meta-sms-gateway-v3.0.2.apk
          if gh release view v3.0.2 >/dev/null 2>&1; then
            gh release upload v3.0.2 meta-sms-gateway-v3.0.2.apk --clobber
          else
            gh release create v3.0.2 meta-sms-gateway-v3.0.2.apk \
              --title "Meta SMS Gateway v3.0.2" \
              --notes "Meta-only Android SMS gateway v3.0.2. Forwards only allowlisted Meta confirmation-code SMS to your own Cloudflare Worker. See README.md for setup. The repository will be made private after this release is published."
          fi

  worker:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cloudflare-worker
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: cloudflare-worker/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npx vitest run
